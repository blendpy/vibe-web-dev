<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Menger Sponge Explosion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            font-size: 14px;
            line-height: 1.5;
        }
        .key {
            background: #fff;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        Press <span class="key">Spacebar</span> to Explode<br><br>
        Left Click: Rotate &bull; Right Click: Pan &bull; Scroll: Zoom
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js'; 

        // 1. Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

// Load the HDRI Room Texture
new RGBELoader().load('little_paris_under_tower_4k.webp', function (texture) {
    // This tells Three.js to wrap the 2D image into a sphere around the camera
    texture.mapping = THREE.EquirectangularReflectionMapping;
    
    // Set it as the visible background
    scene.background = texture;
    
    // Set it as the environment light (adds realistic reflections to the cubes and board)
    scene.environment = texture;
});

        //scene.background = new THREE.Color(0x1a1a1a);
        //scene.fog = new THREE.Fog(0x1a1a1a, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 10, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 2. Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(15, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        scene.add(dirLight);

        // 3. Environment: Floor
        const floorY = -15;
        const gridHelper = new THREE.GridHelper(100, 100, 0x333333, 0x222222);
        gridHelper.position.y = floorY;
        scene.add(gridHelper);

        // 4. Environment: Chess Board Table
        const tableY = -2; // Top of the playing surface
        const tableWidth = 12; // Overall physical bounds for collisions
        
        const tableGroup = new THREE.Group();
        tableGroup.position.set(0, tableY, 0); // y=0 local is the tile surface

        // a) 8x8 Black & White Tiles
        const tileGeo = new THREE.BoxGeometry(1, 0.2, 1);
        const matWhite = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3, metalness: 0.1 });
        const matBlack = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.1 });
        
        for(let x = 0; x < 8; x++) {
            for(let z = 0; z < 8; z++) {
                const isBlack = (x + z) % 2 === 1;
                const tile = new THREE.Mesh(tileGeo, isBlack ? matBlack : matWhite);
                // Center the 8x8 grid. Top surface sits flush at local y=0
                tile.position.set(x - 3.5, -0.1, z - 3.5); 
                tableGroup.add(tile);
            }
        }

        // b) Inner Border: Thin raised dark Walnut lip
        const woodWalnut = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.7 });
        const tbGeo1 = new THREE.BoxGeometry(8.4, 0.3, 0.2); // Top/Bottom strips
        const lrGeo1 = new THREE.BoxGeometry(0.2, 0.3, 8.0); // Left/Right strips
        
        const innerStrips = [
            { geo: tbGeo1, pos: [0, -0.05, 4.1] }, // slightly raised: local top is +0.1
            { geo: tbGeo1, pos: [0, -0.05, -4.1] },
            { geo: lrGeo1, pos: [4.1, -0.05, 0] },
            { geo: lrGeo1, pos: [-4.1, -0.05, 0] }
        ];
        innerStrips.forEach(s => {
            const mesh = new THREE.Mesh(s.geo, woodWalnut);
            mesh.position.set(...s.pos);
            tableGroup.add(mesh);
        });

        // c) Middle Border: Flush Cherry wood trim
        const woodCherry = new THREE.MeshStandardMaterial({ color: 0x763c28, roughness: 0.6 });
        const tbGeo2 = new THREE.BoxGeometry(10, 0.2, 0.8);
        const lrGeo2 = new THREE.BoxGeometry(0.8, 0.2, 8.4);
        
        const midStrips = [
            { geo: tbGeo2, pos: [0, -0.1, 4.6] }, // flush: local top is 0
            { geo: tbGeo2, pos: [0, -0.1, -4.6] },
            { geo: lrGeo2, pos: [4.6, -0.1, 0] },
            { geo: lrGeo2, pos: [-4.6, -0.1, 0] }
        ];
        midStrips.forEach(s => {
            const mesh = new THREE.Mesh(s.geo, woodCherry);
            mesh.position.set(...s.pos);
            tableGroup.add(mesh);
        });

        // d) Outer Base: Solid stepped Oak block under everything
        const woodOak = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.8 });
        const baseGeo = new THREE.BoxGeometry(12, 1, 12);
        const base = new THREE.Mesh(baseGeo, woodOak);
        base.position.set(0, -0.7, 0); // stepped down: local top is -0.2
        tableGroup.add(base);

        // Apply shadows to all table parts
        tableGroup.children.forEach(child => {
            child.receiveShadow = true;
            child.castShadow = true;
        });
        scene.add(tableGroup);

        // 5. Procedural Generation: Menger Sponge
        const spongeLevel = 3; // 8,000 cubes
        const spongeSize = 4;
        const positions = [];
        
        function generateMenger(level, size, x, y, z) {
            if (level === 0) {
                positions.push(new THREE.Vector3(x, y, z));
                return;
            }
            const newSize = size / 3;
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        let zeros = (dx===0?1:0) + (dy===0?1:0) + (dz===0?1:0);
                        if (zeros < 2) generateMenger(level - 1, newSize, x + dx * newSize, y + dy * newSize, z + dz * newSize);
                    }
                }
            }
        }
        generateMenger(spongeLevel, spongeSize, 0, 0, 0);

        // 6. Instanced Mesh Setup
        const boxSize = spongeSize / Math.pow(3, spongeLevel);
        const geometry = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const material = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.1, roughness: 0.8 });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, positions.length);
        instancedMesh.castShadow = true;
        instancedMesh.receiveShadow = true;
        
        // Physics arrays
        const velocities = new Float32Array(positions.length * 3);
        const rotVelocities = new Float32Array(positions.length * 3);
        const rotations = [];
        
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        
        positions.forEach((pos, i) => {
            dummy.position.copy(pos);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
            
            // Random vibrant colors
            color.setHSL(Math.random(), 0.8, 0.5);
            instancedMesh.setColorAt(i, color);
            rotations.push(new THREE.Euler(0,0,0));
        });
        
        instancedMesh.instanceColor.needsUpdate = true;
        scene.add(instancedMesh);

        // 7. Dynamic Text Sprite
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 128;
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false });
        const textSprite = new THREE.Sprite(spriteMaterial);
        textSprite.scale.set(6, 1.5, 1);
        textSprite.position.set(0, 4, 0);
        scene.add(textSprite);

        function updateText(msg) {
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.font = "Bold 80px Arial";
            context.fillStyle = "white";
            context.strokeStyle = "black";
            context.lineWidth = 6;
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.strokeText(msg, 256, 64);
            context.fillText(msg, 256, 64);
            texture.needsUpdate = true;
        }
        updateText("READY");

        // 8. Interaction & Physics Logic
        let state = 'IDLE'; // IDLE, COUNTDOWN, EXPLODING

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && state === 'IDLE') {
                state = 'COUNTDOWN';
                let count = 3;
                
                const interval = setInterval(() => {
                    updateText(count.toString());
                    count--;
                    
                    if (count < 0) {
                        clearInterval(interval);
                        triggerExplosion();
                    }
                }, 1000);
            }
        });

        function triggerExplosion() {
            updateText("BOOM!");
            state = 'EXPLODING';
            
            // Give every cube an outward vector and upward kick
            for (let i = 0; i < positions.length; i++) {
                const pos = positions[i];
                
                const dir = pos.clone().normalize();
                const explosionForce = 4 + Math.random() * 8;
                
                velocities[i*3] = dir.x * explosionForce;
                velocities[i*3 + 1] = 5 + Math.random() * 10; 
                velocities[i*3 + 2] = dir.z * explosionForce;

                rotVelocities[i*3] = (Math.random() - 0.5) * 0.5;
                rotVelocities[i*3 + 1] = (Math.random() - 0.5) * 0.5;
                rotVelocities[i*3 + 2] = (Math.random() - 0.5) * 0.5;
            }

            setTimeout(() => { updateText(""); }, 3000);
        }

        // 9. Animation Loop
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 50;

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1); 

            if (state === 'EXPLODING') {
                const bounceLimit = tableY + boxSize / 2;
                const floorLimit = floorY + boxSize / 2;
                const tableBounds = tableWidth / 2;

                for (let i = 0; i < positions.length; i++) {
                    const pos = positions[i];
                    const rot = rotations[i];
                    const vIdx = i * 3;
                    
                    // Gravity
                    velocities[vIdx + 1] -= 25 * dt; 

                    // Apply Velocity
                    pos.x += velocities[vIdx] * dt;
                    pos.y += velocities[vIdx + 1] * dt;
                    pos.z += velocities[vIdx + 2] * dt;

                    // Table Collision 
                    if (pos.y < bounceLimit && Math.abs(pos.x) < tableBounds && Math.abs(pos.z) < tableBounds) {
                        pos.y = bounceLimit;
                        velocities[vIdx + 1] *= -0.4; 
                        velocities[vIdx] *= 0.85; 
                        velocities[vIdx + 2] *= 0.85;
                        
                        rotVelocities[vIdx] *= 0.8;
                        rotVelocities[vIdx+1] *= 0.8;
                        rotVelocities[vIdx+2] *= 0.8;
                    } 
                    // Floor Collision
                    else if (pos.y < floorLimit) {
                        pos.y = floorLimit;
                        velocities[vIdx + 1] *= -0.3;
                        velocities[vIdx] *= 0.7;
                        velocities[vIdx + 2] *= 0.7;
                        
                        rotVelocities[vIdx] *= 0.5;
                        rotVelocities[vIdx+1] *= 0.5;
                        rotVelocities[vIdx+2] *= 0.5;
                    }

                    // Apply Rotation
                    rot.x += rotVelocities[vIdx];
                    rot.y += rotVelocities[vIdx + 1];
                    rot.z += rotVelocities[vIdx + 2];

                    // Update Instance Matrix
                    dummy.position.copy(pos);
                    dummy.rotation.copy(rot);
                    dummy.updateMatrix();
                    instancedMesh.setMatrixAt(i, dummy.matrix);
                }
                instancedMesh.instanceMatrix.needsUpdate = true;
            } else if (state === 'IDLE' || state === 'COUNTDOWN') {
                controls.autoRotate = true;
                controls.autoRotateSpeed = 1.0;
            } else {
                controls.autoRotate = false;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
