<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Switchboard</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f5f7fb, #0e1117);
      --surface: light-dark(#ffffff, #171b24);
      --surface-2: light-dark(#f0f3f8, #202633);
      --text: light-dark(#141821, #f4f6fb);
      --muted: light-dark(#697386, #9aa4b5);
      --border: light-dark(#dde3ec, #2d3442);
      --accent: #5b5cf0;
      --accent-2: #7678ff;
      --accent-soft: light-dark(#eeedff, #26264a);
      --good: #25a466;
      --shadow: light-dark(0 18px 55px rgba(35, 46, 75, .09), 0 20px 50px rgba(0,0,0,.28));
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    #app-root {
      min-height: 100vh;
      background-color: var(--bg);
      border-radius: 0;
      display: flex;
      flex-direction: column;
    }

    .shell {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 38px);
      letter-spacing: -0.045em;
      line-height: 1.05;
    }

    .sub {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 13%, transparent);
    }

    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .search-row {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr) auto;
      gap: 10px;
    }

    .engine-select,
    .search-input,
    .search-button {
      height: 54px;
      border-radius: 15px;
      border: 1px solid var(--border);
      font: inherit;
    }

    .engine-select {
      padding: 0 14px;
      background: var(--surface-2);
      color: var(--text);
      font-weight: 650;
      cursor: pointer;
      outline: none;
    }

    .input-wrap { position: relative; }
    .search-input {
      width: 100%;
      padding: 0 54px 0 18px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      font-size: 16px;
    }

    .search-input:focus,
    .engine-select:focus {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent);
    }

    .kbd {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 7px;
      pointer-events: none;
    }

    .search-button {
      min-width: 118px;
      padding: 0 18px;
      border: 0;
      color: white;
      font-weight: 750;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(91, 92, 240, .22);
    }

    .search-button:hover { transform: translateY(-1px); }
    .search-button:active { transform: translateY(0); }

    .quick-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 11px 2px 0;
      align-items: center;
    }

    .quick-label {
      color: var(--muted);
      font-size: 12px;
      margin-right: 3px;
    }

    .chip {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 999px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .chip:hover { background: var(--surface-2); color: var(--text); }

    .results-wrap { margin-top: 26px; }

    .results-toolbar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      margin: 0 4px 13px;
    }

    .results-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .engine-pill {
      color: var(--text);
      background: var(--accent-soft);
      padding: 6px 9px;
      border-radius: 999px;
      font-weight: 700;
    }

    .sort-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 9px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .result-list { display: grid; gap: 12px; }

    .result {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
    }

    .result:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
      box-shadow: 0 9px 24px rgba(25, 34, 57, .06);
    }

    .result-source {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .result-title {
      color: var(--accent-2);
      font-weight: 750;
      font-size: 18px;
      margin-bottom: 7px;
      letter-spacing: -0.02em;
    }

    .result-snippet {
      margin: 0;
      color: color-mix(in srgb, var(--text) 77%, var(--muted));
      line-height: 1.55;
      font-size: 13px;
      max-width: 850px;
    }

    .result-footer {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 7px;
      background: var(--surface-2);
    }

    .empty {
      padding: 42px 24px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      text-align: center;
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 5px;
      font-size: 17px;
    }

    footer {
      margin-top: auto;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .footer-inner {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 15px 0 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 1120px); padding-top: 28px; }
      .search-row { grid-template-columns: 1fr; }
      .engine-select, .search-input, .search-button { width: 100%; }
      .results-toolbar { align-items: flex-start; }
      .status { display: none; }
      .footer-inner { width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <div id="app-root">
    <main class="shell">
      <header>
        <div>
          <div class="brand">
            <div class="brand-mark">⌕</div>
            <div>
              <h1>Search Switchboard</h1>
              <p class="sub">Choose the search engine. Keep the results here. Search again anytime.</p>
            </div>
          </div>
        </div>
        <div class="status"><span class="dot"></span> Interactive preview</div>
      </header>

      <section class="search-card" aria-label="Search controls">
        <form id="search-form" class="search-row">
          <label>
            <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Search engine</span>
            <select id="engine" class="engine-select" aria-label="Search engine">
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="brave">Brave Search</option>
              <option value="kagi">Kagi</option>
            </select>
          </label>
          <div class="input-wrap">
            <input id="query" class="search-input" autocomplete="off" placeholder="Search the web…" aria-label="Search query">
            <span class="kbd">Enter</span>
          </div>
          <button class="search-button" type="submit">Search</button>
        </form>
        <div class="quick-row" aria-label="Example searches">
          <span class="quick-label">Try:</span>
          <button class="chip" data-query="wxPython draw a line">wxPython draw a line</button>
          <button class="chip" data-query="best design systems">best design systems</button>
          <button class="chip" data-query="Python image processing">Python image processing</button>
          <button class="chip" data-query="local hiking trails">local hiking trails</button>
        </div>
      </section>

      <section class="results-wrap" aria-live="polite">
        <div class="results-toolbar">
          <div class="results-meta">
            <span id="result-count">4 results</span>
            <span>·</span>
            <span class="engine-pill" id="engine-pill">Google</span>
            <span id="query-label">for “wxPython draw a line”</span>
          </div>
          <button class="sort-btn" id="sort-btn" type="button">Relevance ↕</button>
        </div>
        <div id="result-list" class="result-list"></div>
      </section>
    </main>

    <footer>
      <div class="footer-inner">
        <span>Search Switchboard · single-page search UI prototype</span>
        <span id="recent-label">Searches stay in this page session.</span>
      </div>
    </footer>
  </div>

  <script>
    const data = {
      google: [
        {title:'wx.DC.DrawLine — wxPython API Reference', url:'docs.wxpython.org', snippet:'Draws a line between two points using the device context. A concise reference for working with wx.DC and paint events.', tags:['API','wxPython']},
        {title:'Drawing lines in a wxPython panel', url:'wiki.wxpython.org', snippet:'Examples of using a wx.PaintDC, client coordinates, pens, and a paint event to render custom lines in a panel.', tags:['Examples','GUI']},
        {title:'wxPython Graphics Contexts', url:'docs.wxpython.org', snippet:'Overview of wx.GraphicsContext for anti-aliased lines, paths, transforms, and more advanced drawing operations.', tags:['Graphics','Reference']},
        {title:'Stack Overflow — How to draw a line in wxPython', url:'stackoverflow.com', snippet:'Community answers covering PaintDC, ClientDC, and when to draw during EVT_PAINT rather than directly from a button handler.', tags:['Q&A','Community']}
      ],
      bing: [
        {title:'wx.DC.DrawLine Method', url:'docs.wxpython.org', snippet:'Method reference and parameters for drawing a line from one point to another in a wxPython device context.', tags:['Reference','wxPython']},
        {title:'wxPython: Drawing with Device Contexts', url:'wxpython.org', snippet:'Learn how panels, paint events, pens, brushes, and device contexts fit together for custom drawing.', tags:['Guide','Drawing']},
        {title:'Python GUI Drawing Examples', url:'realpython.com', snippet:'A practical tour through custom graphics concepts in Python desktop interfaces, with examples you can adapt to wxPython.', tags:['Tutorial','Python']},
        {title:'Paint events and custom controls', url:'wiki.wxpython.org', snippet:'Patterns for repainting controls safely and avoiding drawing artifacts when the window is resized or uncovered.', tags:['Patterns','GUI']}
      ],
      duckduckgo: [
        {title:'How to draw a line in wxPython', url:'stackoverflow.com', snippet:'A compact collection of community approaches using wx.PaintDC and EVT_PAINT, with notes on when each technique is appropriate.', tags:['Community','wxPython']},
        {title:'wx.DC documentation', url:'docs.wxpython.org', snippet:'Device context operations include DrawLine, DrawLines, DrawRectangle, and other primitives.', tags:['Docs','API']},
        {title:'wxPython painting tutorial', url:'zetcode.com', snippet:'Learn the basics of drawing shapes and lines in a desktop window and handling repaint events correctly.', tags:['Tutorial','Python']},
        {title:'Drawing with wx.GraphicsContext', url:'docs.wxpython.org', snippet:'Use GraphicsContext when you need smoother, transformed, or more composited drawing than classic device contexts provide.', tags:['Graphics','Advanced']}
      ],
      brave: [
        {title:'wx.DC.DrawLine — wxPython Reference', url:'docs.wxpython.org', snippet:'Draw a line from one coordinate pair to another. Useful when implementing lightweight custom rendering in wxPython.', tags:['API','Reference']},
        {title:'A wxPython custom drawing primer', url:'wxpython.org', snippet:'Start with EVT_PAINT and a paint device context; keep rendering code deterministic so windows redraw correctly.', tags:['Guide','UI']},
        {title:'Building a simple drawing canvas in wxPython', url:'opensource.com', snippet:'A practical example of combining mouse events, stored geometry, and repainting to build an interactive canvas.', tags:['Project','Canvas']},
        {title:'wxPython drawing patterns on GitHub', url:'github.com', snippet:'Small sample projects showing line drawing, mouse tracking, and custom widgets built with wxPython.', tags:['Code','Examples']}
      ],
      kagi: [
        {title:'wx.DC.DrawLine documentation', url:'docs.wxpython.org', snippet:'The canonical method signature and usage notes for drawing a line in wxPython.', tags:['Docs','API']},
        {title:'wxPython PaintDC explained', url:'wiki.wxpython.org', snippet:'Use a paint event to create a PaintDC and redraw the scene from application state whenever the OS requests a repaint.', tags:['Concept','wxPython']},
        {title:'GraphicsContext in wxPython', url:'docs.wxpython.org', snippet:'For scalable and anti-aliased drawing, explore the graphics context APIs and path-based rendering.', tags:['Graphics','Advanced']},
        {title:'wxPython drawing examples', url:'github.com', snippet:'Explore focused code samples for line drawing, shapes, mouse interaction, and custom controls.', tags:['Code','Examples']}
      ]
    };

    const engineNames = {
      google: 'Google',
      bing: 'Bing',
      duckduckgo: 'DuckDuckGo',
      brave: 'Brave Search',
      kagi: 'Kagi'
    };

    const form = document.getElementById('search-form');
    const queryInput = document.getElementById('query');
    const engineInput = document.getElementById('engine');
    const list = document.getElementById('result-list');
    const count = document.getElementById('result-count');
    const pill = document.getElementById('engine-pill');
    const queryLabel = document.getElementById('query-label');
    const sortButton = document.getElementById('sort-btn');

    let current = [...data.google];
    let sortNewestFirst = false;

    function personalize(items, q) {
      if (!q) return items;
      const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
      return [...items].sort((a,b) => {
        const score = (item) => {
          const text = (item.title + ' ' + item.snippet).toLowerCase();
          return terms.reduce((n,t) => n + (text.includes(t) ? 1 : 0), 0);
        };
        return score(b) - score(a);
      });
    }

    function render(items, q) {
      current = items;
      if (!items.length) {
        list.innerHTML = '<div class="empty"><strong>No demo results yet</strong>Try one of the example searches above.</div>';
      } else {
        list.innerHTML = items.map((item, i) => `
          <a class="result" href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" rel="noreferrer">
            <div class="result-source">${item.url}</div>
            <div class="result-title">${item.title}</div>
            <p class="result-snippet">${item.snippet}</p>
            <div class="result-footer">${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </a>
        `).join('');
      }
      count.textContent = `${items.length} results`;
      pill.textContent = engineNames[engineInput.value];
      queryLabel.textContent = q ? `for “${q}”` : '· ready for a new search';
    }

    function doSearch(q) {
      const clean = q.trim();
      if (!clean) {
        render([], '');
        return;
      }
      queryInput.value = clean;
      const base = data[engineInput.value] || data.google;
      render(personalize(base, clean), clean);
      sessionStorage.setItem('switchboard:lastQuery', clean);
      sessionStorage.setItem('switchboard:lastEngine', engineInput.value);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      sortNewestFirst = false;
      sortButton.textContent = 'Relevance ↕';
      doSearch(queryInput.value);
    });

    engineInput.addEventListener('change', () => {
      const q = queryInput.value.trim() || 'wxPython draw a line';
      doSearch(q);
    });

    document.querySelectorAll('.chip').forEach(button => {
      button.addEventListener('click', () => doSearch(button.dataset.query));
    });

    sortButton.addEventListener('click', () => {
      sortNewestFirst = !sortNewestFirst;
      const items = [...current].reverse();
      sortButton.textContent = sortNewestFirst ? 'Recent ↕' : 'Relevance ↕';
      render(items, queryInput.value.trim());
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === '/' && document.activeElement !== queryInput) {
        event.preventDefault();
        queryInput.focus();
      }
    });

    const savedQuery = sessionStorage.getItem('switchboard:lastQuery');
    const savedEngine = sessionStorage.getItem('switchboard:lastEngine');
    if (savedEngine && engineNames[savedEngine]) engineInput.value = savedEngine;
    doSearch(savedQuery || 'wxPython draw a line');
  </script>
</body>
</html>
