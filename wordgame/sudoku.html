<!--
size: 4, 6, 9, 12, 16, 25 (automatically selects the grid configuration and radio button).

difficulty: easy, medium, hard, very difficult (or verydifficult), and symbol (case-insensitive).

random: true / 1. Chooses a random word from the preset dictionary for sizes 4, 6, 9, and 12; forces "UNCOPYRIGHTABLE!" for size 16; and leaves symbols standard when size is 25 (> 16).

bighint: true / 1. Executes the "Add Big Hint" feature, placing the chosen word along a designated row or column with light-blue highlighting.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Size Sudoku Suite</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Panel Controls */
        .left-panel {
            width: 320px;
            background: #ffffff;
            border-right: 1px solid #ccc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .left-panel h2 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
        }

        .options-group {
            display: flex;
            gap: 20px;
        }

        .option-col {
            flex: 1;
        }

        .option-col label {
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .radio-group label {
            font-weight: normal;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 4px 0;
        }

        button {
            padding: 8px 12px;
            border: 1px solid #0056b3;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.88rem;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #0056b3;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.secondary-btn {
            background-color: #f8f9fa;
            color: #333;
            border-color: #ccc;
        }

        button.secondary-btn:hover:not(:disabled) {
            background-color: #e2e6ea;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn-row button {
            flex: 1;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        select {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 0.85rem;
        }

        /* Status Badge */
        .status-badge {
            border: 1px solid #81c784;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            white-space: pre-wrap;
            line-height: 1.3;
        }

        .status-badge.warning {
            background-color: #fff3e0;
            border-color: #ffb74d;
            color: #e65100;
        }

        .status-badge.info {
            background-color: #e1f5fe;
            border-color: #4fc3f7;
            color: #0277bd;
        }

        /* Right Panel Board Area */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #sudoku-grid {
            display: grid;
            background-color: #000 !important; /* Thick black lines between sub-boxes */
            border: 3px solid #000 !important;  /* Outer boundary line */
        }

        .box-frame {
            display: grid;
            background-color: #aaa !important; /* Thin gray lines between internal cells */
        }

        .cell-canvas {
            cursor: pointer;
            display: block;
        }

        /* Input Palette */
        .palette-container {
            width: 100%;
            max-width: 600px;
        }

        .palette-title {
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .palette-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .palette-btn {
            min-width: 34px;
            height: 34px;
            padding: 0 6px;
            background-color: #e9ecef;
            color: #333;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .palette-btn:hover:not(:disabled) {
            background-color: #dee2e6;
        }

        /* All instances of symbol placed on board */
        .palette-btn.all-used {
            opacity: 0.55;
            background-color: #dcdcdc;
        }

        /* Red highlight when selected empty cell has this symbol in its row, col, or box */
        .palette-btn.peer-conflict {
            background-color: #ffcdd2 !important;
            color: #b71c1c !important;
            border-color: #d32f2f !important;
            opacity: 1 !important;
        }

        .palette-btn.peer-conflict:hover {
            background-color: #ef9a9a !important;
        }

        /* Active highlight when symbol is currently highlighted across the board */
        .palette-btn.active-highlight {
            background-color: #ffe082 !important;
            color: #000 !important;
            border: 2px solid #f57f17 !important;
            opacity: 1 !important;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            width: 500px;
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal-body {
            display: flex;
            gap: 15px;
            overflow-y: auto;
        }

        .modal-col {
            flex: 1;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }

        .preset-list {
            width: 100%;
            height: 200px;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow-y: auto;
        }

        .preset-item {
            padding: 4px 8px;
            cursor: pointer;
            font-family: monospace;
        }

        .preset-item:hover, .preset-item.selected {
            background-color: #007bff;
            color: #fff;
        }

        .symbol-entries {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 5px;
            border-radius: 4px;
        }

        .symbol-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .symbol-row input {
            width: 60px;
            padding: 4px;
        }

        /* Print Specific Overrides */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
            }

            .left-panel, .palette-container, button, select, label, .modal-overlay, #print-btn-page {
                display: none !important;
            }

            body, .right-panel, .board-container {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            #sudoku-grid {
                display: grid !important;
                background-color: #000 !important;
                border: 3px solid #000 !important;
            }

            .box-frame {
                display: grid !important;
                background-color: #aaa !important;
            }

            .cell-canvas {
                display: block !important;
                border: none !important;
            }

            .print-header {
                display: block !important;
                text-align: center;
                margin-bottom: 10px;
            }
        }

        .print-header {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Left Configuration Panel -->
    <div class="left-panel">
        <h2>Sudoku Setup</h2>

        <div class="options-group">
            <div class="option-col">
                <label>Select Grid Size:</label>
                <div class="radio-group" id="grid-size-radios"></div>
            </div>
            <div class="option-col">
                <label>Difficulty Rating:</label>
                <div class="radio-group" id="difficulty-radios"></div>
            </div>
        </div>

        <hr>

        <button onclick="app.generateNewBoard()">🎲 New Puzzle</button>
        <button onclick="app.solvePuzzle()">⚡ Instant Solve</button>
        <button onclick="app.verifyUniqueSolution()">🔍 Verify Unique Solution</button>

        <div class="btn-row">
            <button class="secondary-btn" id="undo-btn" onclick="app.undo()" title="Undo (Ctrl+Z)" disabled>↩️ Undo</button>
            <button class="secondary-btn" id="redo-btn" onclick="app.redo()" title="Redo (Ctrl+Y)" disabled>↪️ Redo</button>
        </div>

        <label class="checkbox-label">
            <input type="checkbox" id="allow-modify-givens" onchange="app.allowModifyGivens = this.checked">
            🔓 Edit / Modify Any Cell
        </label>

        <div>
            <label style="font-weight:bold; font-size: 0.85rem;">Hint Technique:</label>
            <select id="hint-technique-select"></select>
        </div>

        <button onclick="app.giveHint()">💡 Give Hint</button>
        <button class="secondary-btn" onclick="app.openShapeModal()">🎨 Cell & Hint Shapes</button>
        <button class="secondary-btn" onclick="app.openSymbolModal()">🔣 Transform Symbols</button>
        <button class="secondary-btn" onclick="app.printPuzzle()">🖨️ Print Puzzle</button>

        <hr>

        <div id="status-badge" class="status-badge"></div>
    </div>

    <!-- Right Board & Input Panel -->
    <div class="right-panel">
        <div class="print-header" id="print-header"></div>
        <div class="board-container">
            <div id="sudoku-grid"></div>

            <div class="palette-container">
                <div class="palette-title">Character Palette (Click=Highlight, Space=Hint, Return=Next cell):</div>
                <div class="palette-buttons" id="palette-buttons"></div>
            </div>
        </div>
    </div>
</div>

<!-- Cell & Hint Shapes Modal -->
<div class="modal-overlay" id="shape-modal">
    <div class="modal-content">
        <h3>Select Cell & Hint Shapes</h3>
        <div class="modal-body">
            <div class="modal-col">
                <label>Choose Cell Shape:</label>
                <div class="radio-group" id="cell-shape-radios"></div>
            </div>
            <div class="modal-col">
                <label>Choose Hint Shape:</label>
                <div class="radio-group" id="hint-shape-radios"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="secondary-btn" onclick="app.closeShapeModal()">Cancel</button>
            <button onclick="app.applyShapeModal()">Apply</button>
        </div>
    </div>
</div>

<!-- Symbol Transformation Modal -->
<div class="modal-overlay" id="symbol-modal">
    <div class="modal-content">
        <h3>Transform Symbols</h3>
        <div class="modal-body">
            <div class="modal-col" style="flex:0.8;">
                <label>Word Presets:</label>
                <div class="preset-list" id="preset-list"></div>
            </div>
            <div class="modal-col">
                <label>Symbol Values:</label>
                <div class="symbol-entries" id="symbol-entries"></div>
            </div>
        </div>
        <div style="display:flex; gap:4px; flex-wrap:wrap;">
            <button class="secondary-btn" onclick="app.resetSymbolsDefault()">Reset Symbols</button>
            <button class="secondary-btn" onclick="app.useAlphabetSymbols()">Use A-Z</button>
            <button class="secondary-btn" id="use-numbers-btn" onclick="app.useNumericSymbols()">Use 1-N</button>
            <button class="secondary-btn" onclick="app.addBigHint()">💡 Add Big Hint</button>
        </div>
        <div class="modal-footer">
            <button class="secondary-btn" onclick="app.closeSymbolModal()">Cancel</button>
            <button onclick="app.applySymbolModal()">Apply</button>
        </div>
    </div>
</div>

<script src="sudoku.js"></script>
</body>
</html>
